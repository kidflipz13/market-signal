<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Market Signal</title>

  <style>
    body {
      margin: 0;
      background: #07111f;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .wrap {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .green {
      color: #39e58c;
    }

    .status {
      margin-top: 30px;
      padding: 20px;
      background: #101d30;
      border-radius: 12px;
    }

    .game {
      background: #101d30;
      margin-top: 15px;
      padding: 18px;
      border-radius: 12px;
      border-left: 4px solid #39e58c;
    }

    .teams {
      font-size: 18px;
      font-weight: bold;
    }

    .time {
      margin-top: 8px;
      color: #9fb0c5;
    }

    .books {
      margin-top: 8px;
      color: #67a9ff;
    }

    .error {
      color: #ff6767;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <h1>
      MARKET <span class="green">SIGNAL</span>
    </h1>

    <div>
      NFL Market Intelligence
    </div>

    <div
      id="status"
      class="status"
    >
      Connecting to live NFL odds...
    </div>

    <div id="games"></div>

  </div>


  <script>

    const API =
      "https://market-signal-api.kidflipz13.workers.dev/";

    async function loadOdds() {

      const status =
        document.getElementById("status");

      const gamesContainer =
        document.getElementById("games");

      try {

        /*
          Timeout prevents the page from
          sitting on Loading forever.
        */

        const controller =
          new AbortController();

        const timeout =
          setTimeout(
            () => controller.abort(),
            15000
          );


        const response =
          await fetch(
            API,
            {
              method: "GET",
              signal: controller.signal
            }
          );


        clearTimeout(timeout);


        if (!response.ok) {

          throw new Error(
            "Worker returned HTTP " +
            response.status
          );
        }


        const data =
          await response.json();


        console.log(
          "MarketSignal API:",
          data
        );


        if (!data.success) {

          throw new Error(
            data.error ||
            "API returned success false"
          );
        }


        /*
          Temporary Worker currently returns
          raw Odds API game objects.
        */

        const games =
          Array.isArray(data.games)
            ? data.games
            : [];


        status.innerHTML =
          '<span class="green">' +
          'CONNECTED ✓' +
          '</span><br><br>' +
          games.length +
          ' live NFL games received.';


        if (games.length === 0) {

          gamesContainer.innerHTML =
            '<div class="status">' +
            'No NFL games returned.' +
            '</div>';

          return;
        }


        gamesContainer.innerHTML =
          games.map(game => {

            const away =
              game.away_team ||
              game.awayTeam ||
              "Away Team";

            const home =
              game.home_team ||
              game.homeTeam ||
              "Home Team";

            const start =
              game.commence_time ||
              game.startTime ||
              "";

            const books =
              Array.isArray(game.bookmakers)
                ? game.bookmakers.length
                : 0;


            let timeText = start;

            if (start) {

              const date =
                new Date(start);

              if (!isNaN(date)) {

                timeText =
                  date.toLocaleString();
              }
            }


            return `
              <div class="game">

                <div class="teams">
                  ${escapeHtml(away)}
                  @
                  ${escapeHtml(home)}
                </div>

                <div class="time">
                  ${escapeHtml(timeText)}
                </div>

                <div class="books">
                  ${books}
                  sportsbooks received
                </div>

              </div>
            `;

          }).join("");
      }

      catch (error) {

        console.error(
          "MarketSignal frontend error:",
          error
        );


        const message =
          error.name === "AbortError"
            ? "Request timed out after 15 seconds."
            : error.message;


        status.innerHTML =
          '<span class="error">' +
          'CONNECTION FAILED' +
          '</span><br><br>' +
          escapeHtml(message);
      }
    }


    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    loadOdds();

  </script>

</body>
</html>
